<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
<rect width="1600" height="1000" fill="#0b0b0b"/>
<text x="134" y="150" fill="#ece9e2" font-family="'Inter Tight', ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="300">A check-in has to clear all four</text>
<text x="134" y="198" fill="rgba(236,233,226,0.34)" font-family="'Inter Tight', ui-sans-serif, system-ui, sans-serif" font-size="26">Run on the server in this order; the first refusal is returned and shown.</text>
<circle cx="168" cy="300" r="34" fill="none" stroke="rgba(236,233,226,0.62)" stroke-width="3"/><text x="168" y="311" text-anchor="middle" fill="#ece9e2" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="30">1</text><path d="M168 334 V416" stroke="rgba(236,233,226,0.12)" stroke-width="3"/><text x="250" y="296" fill="#ece9e2" font-family="'Inter Tight', ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="300">Token</text><text x="250" y="340" fill="rgba(236,233,226,0.62)" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="24">AES-256-CBC, fresh IV, dies 15 s after it is minted</text>
<circle cx="168" cy="450" r="34" fill="none" stroke="rgba(236,233,226,0.62)" stroke-width="3"/><text x="168" y="461" text-anchor="middle" fill="#ece9e2" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="30">2</text><path d="M168 484 V566" stroke="rgba(236,233,226,0.12)" stroke-width="3"/><text x="250" y="446" fill="#ece9e2" font-family="'Inter Tight', ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="300">Enrolment</text><text x="250" y="490" fill="rgba(236,233,226,0.62)" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="24">the student is enrolled in this course</text>
<circle cx="168" cy="600" r="34" fill="none" stroke="rgba(236,233,226,0.62)" stroke-width="3"/><text x="168" y="611" text-anchor="middle" fill="#ece9e2" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="30">3</text><path d="M168 634 V716" stroke="rgba(236,233,226,0.12)" stroke-width="3"/><text x="250" y="596" fill="#ece9e2" font-family="'Inter Tight', ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="300">Device</text><text x="250" y="640" fill="rgba(236,233,226,0.62)" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="24">FingerprintJS id matches the one bound on first use</text>
<circle cx="168" cy="750" r="34" fill="none" stroke="#8aa2ff" stroke-width="3"/><text x="168" y="761" text-anchor="middle" fill="#8aa2ff" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="30">4</text><text x="250" y="746" fill="#ece9e2" font-family="'Inter Tight', ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="300">Position</text><text x="250" y="790" fill="rgba(236,233,226,0.62)" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="24">ST_Contains(classroom.geofence, ST_Point(lng, lat))</text>
<text x="1466" y="900" text-anchor="end" fill="rgba(236,233,226,0.34)" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="22">the projector mints a new code every 10 s</text>
</svg>